name: Documentation Build & Validation Pipeline

on:
  workflow_dispatch: # Enables the manual run button
  push:
    branches:
      - main
  pull_request:
    branches:
      - main  

jobs:
  validate-and-build:
    name: Execute Verification and Asset Compilation
    runs-on: ubuntu-latest
    
    # We set outputs so the downstream matrix job can read our dynamic file list
    outputs:
      pdf_matrix: ${{ steps.generate-matrix.outputs.matrix }}

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository Context
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install System Asciidoctor and PDF Engines
        run: |
          sudo apt-get update
          sudo apt-get install -y asciidoctor ruby-asciidoctor-pdf
         
      - name: Install Project Workspace Dependencies
        run: npm ci --legacy-peer-deps

      - name: Execute Build All Script
        run: node utility_scripts/build/build-all.js --prod

      - name: Inject PDFs into Website Directory Structure
        run: |
          # Create the full nested directory path safely
          mkdir -p build/web/resources/PDFs/
          # Copy the compiled PDFs into the correct location
          cp -r build/PDFs/. build/web/resources/PDFs/
          echo "Merged build/PDFs content into build/web/resources/PDFs/"

      # DYNAMIC GENERATION: Find files in /publications and create a JSON array for the matrix
      - name: Generate PDF Matrix List
        id: generate-matrix
        run: |
          cd publications
          # Finds all files, strips the path prefix, maps extensions, and formats as JSON
          FILES_JSON=$(find . -type f | sed 's|^\./||' | jq -R '.' | jq -s -c '.')
          echo "matrix=${FILES_JSON}" >> "$GITHUB_OUTPUT"

      # Temporarily save everything so the next job can process them
      - name: Upload Raw Build Workspace
        uses: actions/upload-artifact@v4
        with:
          name: raw-build-assets
          path: build/
          retention-days: 1

      - name: Upload Complete Web Server Bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/
          retention-days: 7

      - name: Deploy Unified Web Target to GitHub Pages
        uses: actions/deploy-pages@v4

  # This job runs in parallel for each file found dynamically in the /publications directory
  upload-individual-pdfs:
    name: "Publish Artifact: ${{ matrix.publication_file }}"
    needs: validate-and-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        publication_file: ${{ fromJSON(needs.validate-and-build.outputs.pdf_matrix) }}
    steps:
      - name: Download Raw Build Assets
        uses: actions/download-artifact@v4
        with:
          name: raw-build-assets
          path: build/

      - name: Extract Filename for Display Name
        id: parse-name
        run: |
          # Converts 'subfolder/my-doc.adoc' into 'my-doc' to ensure clean display entries
          CLEAN_NAME=$(basename "${{ matrix.publication_file }}" | cut -f 1 -d '.')
          echo "clean_name=${CLEAN_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Single PDF Row
        uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ steps.parse-name.outputs.clean_name }}
          # This matches your exact filename structure inside the built folder 
          path: build/PDFs/**/${{ steps.parse-name.outputs.clean_name }}.pdf
          retention-days: 14
